    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          var currentFetch = typeof origFetch === 'function' ? origFetch.bind(window) : origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var proto = Window.prototype;
            if (proto) {
              var protoFetch = proto.fetch;
              Object.defineProperty(proto, 'fetch', {
                get: function() { return protoFetch; },
                set: function(v) { protoFetch = v; },
                configurable: true,
                enumerable: true
              });
            }
          } catch (err) {}
        }
      })();
    </script>
